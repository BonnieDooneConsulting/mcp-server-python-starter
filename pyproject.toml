[project]
name = "mcp-server-python-starter"
version = "0.1.0"
description = "A clean, production-minded starter for building MCP servers in Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bonnie Doone Consulting LLC" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "llm", "claude", "template"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
]

# Dev tools are listed twice: as an extra for `pip install -e ".[dev]"` and as a
# dependency group for uv. Keep the two lists in sync.
[project.optional-dependencies]
dev = [
    "anyio>=4.10",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
mcp-starter = "mcp_starter.cli:main"

[project.urls]
Homepage = "https://github.com/BonnieDooneConsulting/mcp-server-python-starter"
Issues = "https://github.com/BonnieDooneConsulting/mcp-server-python-starter/issues"

# uv reads this group for `uv sync` (installed by default) and `uv run`.
[dependency-groups]
dev = [
    "anyio>=4.10",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_starter"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
    "T20", # no print() in library code (stdout belongs to the stdio transport)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
